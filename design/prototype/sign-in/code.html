nsparent_70%)] z-0"></div><div class="fixed inset-0 pointer-events-none bg-gradient-to-b from-[#101215]/60 via-transparent to-[#0a0b0d]/95 z-0"></div><main class="relative z-10 w-full min-h-screen flex flex-col justify-center items-center px-margin md:px-margin-desktop py-space-xl"><div class="flex flex-col w-full items-center justify-center relative">
<div class="fixed top-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-2 p-1.5 rounded-full bg-[#16191e]/90 backdrop-blur-md shadow-2xl border border-[#262b33]">
<span class="font-label-xs-caps text-label-xs-caps text-slate-400 uppercase tracking-wider px-3 hidden sm:inline-block">Simulation:</span>
<button class="px-3 py-1.5 rounded-full font-label-md text-label-md transition-all bg-teal-500 text-slate-950 font-semibold shadow-sm" id="btn-state-default" type="button">
      Default State
    </button>
<button class="px-3 py-1.5 rounded-full font-label-md text-label-md transition-all text-slate-300 hover:text-teal-400 hover:bg-[#20252d]" id="btn-state-loading" type="button">
      Button Loading
    </button>
<button class="px-3 py-1.5 rounded-full font-label-md text-label-md transition-all text-slate-300 hover:text-teal-400 hover:bg-[#20252d]" id="btn-state-error" type="button">
      Error State
    </button>
</div>
<div class="w-full max-w-md mx-auto my-auto relative z-10">
<div class="relative bg-[#16191e] text-white rounded-2xl shadow-2xl p-8 sm:p-10 border border-[#262b33] overflow-hidden transition-all duration-300">
<!-- Delicate Top Accent Glow Line -->
<div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#14b8a6] to-transparent"></div>
<div class="flex flex-col items-start text-left mb-7">

<h1 class="text-white font-headline-sm font-semibold tracking-wide text-lg mt-1">Sign in to your account</h1>
<p class="text-slate-400 text-xs mt-0.5">Fred's Auto Electrical Portal Access</p>
</div>
<div class="mb-5 p-3.5 rounded-xl bg-red-950/40 border border-red-800/60 flex items-center gap-3 text-red-200 transition-all duration-300 animate-fadeIn hidden" id="error-alert" role="alert">
<span class="material-symbols-outlined text-red-400 text-xl flex-shrink-0">error</span>
<span class="font-body-md text-body-md font-medium text-red-200">Incorrect email or password</span>
</div>
<form class="space-y-4" id="login-form" onsubmit="event.preventDefault(); handleSubmit();">
<div class="space-y-1.5 text-left">
<label class="block font-label-md text-label-md font-medium text-slate-300" for="email">
            Email address
          </label>
<div class="relative rounded-lg">
<input class="w-full px-4 py-2.5 rounded-lg border bg-[#1a1d24] text-white placeholder-slate-500 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-[#14b8a6] focus:border-[#14b8a6] transition-colors border-[#2e3440]" id="email" name="email" placeholder="kyle.osei@autotrack.com" required="" type="email" value="kyle.osei@autotrack.com">
</div>
</div>
<div class="space-y-1.5 text-left">
<label class="block font-label-md text-label-md font-medium text-slate-300" for="password">
            Password
          </label>
<div class="relative rounded-lg flex items-center">
<input class="w-full px-4 py-2.5 pr-11 rounded-lg border bg-[#1a1d24] text-white placeholder-slate-500 font-body-md text-body-md focus:outline-none focus:ring-1 focus:ring-[#14b8a6] focus:border-[#14b8a6] transition-colors border-[#2e3440]" id="password" name="password" placeholder="••••••••••••" required="" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-200 focus:outline-none" id="toggle-password" type="button">
<span class="material-symbols-outlined text-xl" id="password-icon">visibility</span>
</button>
</div>
</div>
<button class="w-full mt-3 py-3 px-4 rounded-xl font-label-md text-label-md font-semibold tracking-wide text-slate-950 bg-[#14b8a6] hover:bg-[#2dd4bf] active:bg-[#0d9488] transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-teal-950/40 hover:shadow-teal-900/50 focus:outline-none focus:ring-2 focus:ring-[#14b8a6] focus:ring-offset-2 focus:ring-offset-[#16191e]" id="submit-button" type="submit">
<span class="" id="btn-text">Sign in</span>
<span class="items-center hidden" id="btn-spinner">
<svg class="animate-spin h-5 w-5 text-slate-950" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
<span class="ml-2 font-semibold">Signing in...</span>
</span>
</button>
<div class="pt-3 text-center">
<p class="font-body-md text-body-md text-slate-400">
            Forgot your password? <a class="text-[#14b8a6] font-medium hover:text-[#2dd4bf] hover:underline focus:outline-none ml-1 transition-colors" href="#">Contact your admin.</a>
</p>
</div>
</form>
</div>
</div>
<script>
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('toggle-password');
    const passwordIcon = document.getElementById('password-icon');
    const submitBtn = document.getElementById('submit-button');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const errorAlert = document.getElementById('error-alert');

    const btnStateDefault = document.getElementById('btn-state-default');
    const btnStateLoading = document.getElementById('btn-state-loading');
    const btnStateError = document.getElementById('btn-state-error');

    let currentLoadingTimer = null;

    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      passwordIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
    });

    function setPreviewPills(activeBtn) {
      [btnStateDefault, btnStateLoading, btnStateError].forEach(btn => {
        btn.className = "px-3 py-1.5 rounded-full font-label-md text-label-md transition-all text-slate-300 hover:text-teal-400 hover:bg-[#20252d]";
      });
      activeBtn.className = "px-3 py-1.5 rounded-full font-label-md text-label-md transition-all bg-teal-500 text-slate-950 font-semibold shadow-sm";
    }

    function applyStateDefault() {
      clearTimeout(currentLoadingTimer);
      setPreviewPills(btnStateDefault);
      
      errorAlert.classList.add('hidden');
      emailInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
      emailInput.classList.add('border-[#2e3440]', 'focus:ring-[#14b8a6]', 'focus:border-[#14b8a6]');
      
      passwordInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
      passwordInput.classList.add('border-[#2e3440]', 'focus:ring-[#14b8a6]', 'focus:border-[#14b8a6]');

      submitBtn.removeAttribute('disabled');
      submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      btnText.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
      btnSpinner.classList.remove('flex');
    }

    function applyStateLoading() {
      clearTimeout(currentLoadingTimer);
      setPreviewPills(btnStateLoading);

      errorAlert.classList.add('hidden');
      emailInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
      emailInput.classList.add('border-[#2e3440]', 'focus:ring-[#14b8a6]', 'focus:border-[#14b8a6]');
      
      passwordInput.classList.remove('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
      passwordInput.classList.add('border-[#2e3440]', 'focus:ring-[#14b8a6]', 'focus:border-[#14b8a6]');

      submitBtn.setAttribute('disabled', 'true');
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      btnText.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      btnSpinner.classList.add('flex');
    }

    function applyStateError() {
      clearTimeout(currentLoadingTimer);
      setPreviewPills(btnStateError);

      submitBtn.removeAttribute('disabled');
      submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
      btnText.classList.remove('hidden');
      btnSpinner.classList.add('hidden');
      btnSpinner.classList.remove('flex');

      errorAlert.classList.remove('hidden');

      emailInput.classList.remove('border-[#2e3440]', 'focus:ring-[#14b8a6]', 'focus:border-[#14b8a6]');
      emailInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');

      passwordInput.classList.remove('border-[#2e3440]', 'focus:ring-[#14b8a6]', 'focus:border-[#14b8a6]');
      passwordInput.classList.add('border-red-500', 'focus:ring-red-500', 'focus:border-red-500');
    }

    function handleSubmit() {
      applyStateLoading();
      currentLoadingTimer = setTimeout(() => {
        applyStateError();
      }, 1200);
    }

    btnStateDefault.addEventListener('click', applyStateDefault);
    btnStateLoading.addEventListener('click', applyStateLoading);
    btnStateError.addEventListener('click', applyStateError);

    [emailInput, passwordInput].forEach(el => {
      el.addEventListener('input', () => {
        if (!errorAlert.classList.contains('hidden')) {
          applyStateDefault();
        }
      });
    });
  </script>
</div></main>


</body></html>
