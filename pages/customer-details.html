<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer - Fred's Auto Electrical</title>
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>
    <!-- the sidebar and top bar are added by src/js/shared/page.js -->

    <div class="flex flex-col">

    <main class="flex-1 p-6 space-y-8 max-w-7xl w-full">

        <!-- back link and actions -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <a href="/pages/customers.html" class="inline-flex items-center gap-2 text-sm text-muted hover:text-ink transition">
                <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                Back to Customers
            </a>

            <div id="actions" class="hidden flex flex-wrap items-center gap-2">
                <button id="edit-btn" class="btn bg-surface hover:bg-raised border border-line-strong px-4 py-2 text-xs">
                    <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536M4 20h4L18.5 9.5a2.5 2.5 0 0 0-3.536-3.536L4.5 16.5 4 20z" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    Edit Customer
                </button>
                <button id="new-job-btn" class="btn bg-surface hover:bg-raised border border-line-strong px-4 py-2 text-xs">
                    <svg class="size-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    New Job
                </button>
                <a id="new-appointment-link" class="btn bg-surface hover:bg-raised border border-line-strong px-4 py-2 text-xs">
                    <svg class="size-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    New Appointment
                </a>

                <!-- overflow menu: edit details and export for everyone, delete for admins -->
                <div class="relative">
                    <button id="more-btn" class="btn bg-surface hover:bg-raised border border-line-strong p-2" aria-label="More options" aria-haspopup="true" aria-expanded="false">
                        <svg class="size-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z" /></svg>
                    </button>
                    <div id="more-menu" class="hidden absolute right-0 mt-1.5 w-48 card shadow-xl shadow-black/40 z-20 py-1 overflow-hidden" role="menu">
                        <button id="edit-details-btn" type="button" role="menuitem" class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 hover:bg-raised transition cursor-pointer">
                            <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536M4 20h4L18.5 9.5a2.5 2.5 0 0 0-3.536-3.536L4.5 16.5 4 20z" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span class="font-medium">Edit Details</span>
                        </button>
                        <div class="my-1 border-t border-line"></div>
                        <p class="px-3 pt-1 pb-0.5 text-[10px] font-semibold text-muted uppercase tracking-wider">Export profile</p>
                        <button id="print-btn" type="button" role="menuitem" class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 hover:bg-raised transition cursor-pointer">
                            <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2m2 4h6a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2zm8-12V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v4h10z" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span class="font-medium">Print / Save PDF</span>
                        </button>
                        <button id="export-btn" type="button" role="menuitem" class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 hover:bg-raised transition cursor-pointer">
                            <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-4-4 4m0 0-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span class="font-medium">Export CSV</span>
                        </button>
                        <div id="delete-wrap" class="hidden">
                            <div class="my-1 border-t border-line"></div>
                            <button id="delete-btn" type="button" role="menuitem" class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 text-status-overdue hover:bg-status-overdue/15 transition cursor-pointer">
                                <svg class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" /></svg>
                                <span class="font-medium">Delete customer</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- loading / error / not found message -->
        <p id="state-message" class="p-8 text-center text-muted">Loading customer...</p>

        <div id="content" class="hidden space-y-8">

            <!-- customer card -->
            <section class="card rounded-xl px-8 py-10 min-h-48 relative overflow-hidden flex">
                <div class="absolute inset-0 bg-linear-to-br from-accent/5 to-transparent pointer-events-none"></div>
                <div class="relative flex-1 flex flex-wrap items-start justify-between gap-4">
                    <div class="min-w-0 self-center">
                        <h1 id="customer-name" class="font-display text-4xl font-bold tracking-wider uppercase break-words"></h1>
                        <p class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
                            <span id="customer-phone" class="font-mono font-bold text-accent"></span>
                            <a id="customer-email" class="hidden text-muted hover:text-accent transition"></a>
                        </p>
                        <p id="customer-address" class="hidden mt-3 items-center gap-1.5 text-xs text-muted">
                            <svg class="size-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17.657 16.657 13.414 20.9a2 2 0 0 1-2.827 0l-4.244-4.243a8 8 0 1 1 11.314 0z" stroke-linecap="round" stroke-linejoin="round" /><path d="M15 11a3 3 0 1 1-6 0 3 3 0 0 1 6 0z" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span id="customer-address-text"></span>
                        </p>
                    </div>
                    <p id="customer-since" class="font-mono text-xs text-muted"></p>
                </div>
            </section>

            <!-- vehicles -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 id="vehicles-title" class="font-display text-sm font-bold tracking-widest text-muted"></h2>
                    <button id="add-vehicle-btn" class="btn bg-surface hover:bg-raised border border-line-strong px-3 py-1.5 text-xs">
                        <svg class="size-3.5 text-accent" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        Add Vehicle
                    </button>
                </div>
                <div id="vehicles" class="grid gap-4 md:grid-cols-2"></div>
            </section>

            <!-- job history -->
            <section>
                <div class="flex items-center justify-between mb-4">
                    <h2 id="jobs-title" class="font-display text-sm font-bold tracking-widest text-muted"></h2>
                    <span class="text-[10px] font-semibold tracking-widest text-muted uppercase">Sorted by date</span>
                </div>
                <div id="jobs" class="card overflow-hidden divide-y divide-line"></div>
            </section>
        </div>
    </main>
    </div>

    <script type="module" src="/src/js/customers/customer-details.js"></script>
</body>
</html>
