<!-- admin dashboard (same script as the staff dashboard, plus parts alerts and the reports link) -->
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Fred's Auto Electrical</title>
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body data-admin-page>
    <!-- the sidebar and top bar are added by src/js/shared/page.js -->

    <div class="flex flex-col">

    <main class="flex-1 p-6 space-y-6">

        <!-- greeting and the reports link -->
        <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
            <div class="flex items-center gap-3">
                <h1 id="greeting" class="font-display text-3xl font-bold tracking-wide">Welcome back</h1>
                <span class="size-2.5 rounded-full bg-accent shadow-[0_0_0_4px_rgba(20,184,166,0.12)]" title="Dashboard active"></span>
            </div>
        </div>
        <a href="/pages/admin/reports.html" class="text-sm font-semibold text-accent hover:underline">View reports →</a>
        </div>

        <!-- shown when something fails to load -->
        <p id="dashboard-error" role="alert" class="hidden card border-status-overdue/40 bg-status-overdue/10 p-4 text-sm text-status-overdue"></p>

        <!-- search and quick actions -->
        <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="relative flex-1 min-w-60 max-w-md">
                <svg class="size-4 absolute left-3 top-1/2 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <input id="dashboard-search" type="search" autocomplete="off" aria-label="Search the dashboard"
                    placeholder="Search customer, job or plate number" class="field pl-9 pr-16" />
                <kbd data-shortcut-label class="absolute right-3 top-1/2 -translate-y-1/2 font-mono text-[10px] text-muted border border-line-strong bg-raised rounded px-1.5 py-0.5">Ctrl+K</kbd>
            </div>

            <!-- the dashboard script opens the shared modals for these -->
            <div class="flex flex-wrap gap-2">
                <button type="button" data-open="job" class="btn btn-primary">
                    <span class="text-xl leading-none">+</span> New job
                </button>
                <button type="button" data-open="appointment" class="btn btn-primary">
                    <span class="text-xl leading-none">+</span> New appointment
                </button>
                <button type="button" data-open="customer" class="btn btn-primary">
                    <span class="text-xl leading-none">+</span> Add customer
                </button>
            </div>
        </div>

        <!-- summary cards, clicking one scrolls to its section -->
        <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
            <button type="button" data-scroll="recent-section" class="card p-4 text-left transition hover:bg-raised cursor-pointer">
                <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-muted">
                    Active jobs
                    <span class="size-8 rounded-lg bg-raised text-accent flex items-center justify-center">
                        <svg class="size-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
                    </span>
                </div>
                <p class="mt-3 flex flex-wrap items-baseline gap-2">
                    <strong id="active-count" class="font-display text-3xl font-bold tabular-nums">—</strong>
                    <span class="text-xs text-muted">Not yet delivered</span>
                </p>
            </button>

            <button type="button" data-scroll="attention-section" class="card border-t-2 border-t-status-overdue p-4 text-left transition hover:bg-raised cursor-pointer">
                <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-status-overdue">
                    Overdue jobs
                    <span class="size-8 rounded-lg bg-status-overdue/10 flex items-center justify-center">
                        <svg class="size-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
                    </span>
                </div>
                <p class="mt-3 flex flex-wrap items-baseline gap-2">
                    <strong id="overdue-count" class="font-display text-3xl font-bold tabular-nums text-status-overdue">—</strong>
                    <span class="text-xs text-muted">Action required</span>
                </p>
            </button>

            <button type="button" data-scroll="appointments-section" class="card p-4 text-left transition hover:bg-raised cursor-pointer">
                <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-muted">
                    Today's appointments
                    <span class="size-8 rounded-lg bg-raised text-accent flex items-center justify-center">
                        <svg class="size-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
                    </span>
                </div>
                <p class="mt-3 flex flex-wrap items-baseline gap-2">
                    <strong id="appointment-count" class="font-display text-3xl font-bold tabular-nums">—</strong>
                    <span id="next-appointment" class="text-xs text-muted">Scheduled for today</span>
                </p>
            </button>

            <button type="button" data-scroll="parts-section" class="card border-t-2 border-t-status-awaiting-parts p-4 text-left transition hover:bg-raised cursor-pointer">
                <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wider text-status-awaiting-parts">
                    Parts alerts
                    <span class="size-8 rounded-lg bg-status-awaiting-parts/10 flex items-center justify-center">
                        <svg class="size-[18px]" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 2H4c-1 0-2 .9-2 2v3.01c0 .72.43 1.34 1 1.69V20c0 1.1 1.1 2 2 2h14c.9 0 2-.9 2-2V8.7c.57-.35 1-.97 1-1.69V4c0-1.1-1-2-2-2zm-5 12H9v-2h6v2zm5-7H4V4l16-.02V7z"/></svg>
                    </span>
                </div>
                <p class="mt-3 flex flex-wrap items-baseline gap-2">
                    <strong id="parts-count" class="font-display text-3xl font-bold tabular-nums text-status-awaiting-parts">—</strong>
                    <span class="text-xs text-muted">Usage limit reached</span>
                </p>
            </button>
        </div>

        <!-- today's appointments and parts alerts -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

            <section id="appointments-section" class="min-w-0 scroll-mt-20">
                <div class="mb-3 flex flex-wrap items-center justify-between gap-3">
                    <h2 class="flex items-center gap-2 font-display text-sm font-bold uppercase tracking-wider">
                        Today's appointments
                        <span id="appointment-badge" class="rounded-full bg-raised px-2 py-1 text-[10px] font-bold text-muted">0</span>
                    </h2>
                    <!-- buttons are styled by the script -->
                    <div class="flex bg-app border border-line-strong rounded-lg p-1 text-xs font-semibold">
                        <button type="button" data-appt-filter="all" class="appt-filter px-3 py-1 rounded-md">All</button>
                        <button type="button" data-appt-filter="pending" class="appt-filter px-3 py-1 rounded-md">Pending</button>
                        <button type="button" data-appt-filter="done" class="appt-filter px-3 py-1 rounded-md">Done</button>
                    </div>
                </div>
                <div id="appointments-list" class="flex flex-col gap-2">
                    <p class="card p-6 text-center text-sm text-muted">Loading appointments...</p>
                </div>
            </section>

            <section id="parts-section" class="min-w-0 scroll-mt-20">
                <div class="mb-3 flex items-center justify-between gap-3">
                    <h2 class="flex items-center gap-2 font-display text-sm font-bold uppercase tracking-wider">
                        Parts alerts
                        <span id="parts-badge" class="rounded-full bg-status-awaiting-parts/10 px-2 py-1 text-[10px] font-bold text-status-awaiting-parts">0</span>
                    </h2>
                    <a href="/pages/admin/parts.html" class="text-sm font-semibold text-accent hover:underline">All parts →</a>
                </div>
                <div id="parts-list" class="flex flex-col gap-2">
                    <p class="card p-6 text-center text-sm text-muted">Loading parts alerts...</p>
                </div>
            </section>

        </div>

        <!-- needs attention -->
        <section id="attention-section" class="scroll-mt-20">
            <div class="mb-3 flex items-center justify-between gap-3">
                <h2 class="flex items-center gap-2 font-display text-sm font-bold uppercase tracking-wider">
                    Needs attention
                    <span id="attention-badge" class="rounded-full bg-status-overdue/10 px-2 py-1 text-[10px] font-bold text-status-overdue">0</span>
                </h2>
            </div>
            <div id="attention-list" class="flex flex-col gap-2">
                <p class="card p-6 text-center text-sm text-muted">Loading alerts...</p>
            </div>
        </section>

        <!-- recent jobs -->
        <section id="recent-section" class="scroll-mt-20">
            <div class="mb-3 flex items-center justify-between gap-3">
                <h2 class="font-display text-sm font-bold uppercase tracking-wider">Recent jobs</h2>
                <a href="/pages/jobs.html" class="text-sm font-semibold text-accent hover:underline">View all jobs →</a>
            </div>
            <div class="card overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-table-head text-[11px] font-bold tracking-wider uppercase border-b border-line">
                        <tr>
                            <th class="px-5 py-4 w-[34%]">Problem</th>
                            <th class="px-5 py-4">Customer &amp; vehicle</th>
                            <th class="px-5 py-4 text-center">Status</th>
                            <th class="px-5 py-4">Updated</th>
                            <th class="px-5 py-4 w-10"></th>
                        </tr>
                    </thead>
                    <tbody id="recent-jobs-body" class="divide-y divide-line">
                        <tr><td colspan="5" class="p-8 text-center text-muted">Loading jobs...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    </div>

    <script type="module" src="/src/js/dashboard/dashboard.js"></script>
</body>
</html>
