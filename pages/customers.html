<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers - Fred's Auto Electrical</title>
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>
    <!-- the sidebar and top bar are added by src/js/shared/page.js -->

    <div class="flex flex-col">

    <main class="flex-1 p-6 space-y-5">

        <!-- page heading -->
        <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div>
                <h1 class="font-display text-3xl font-bold tracking-wider">CUSTOMERS</h1>
                <p id="total-count" class="text-sm text-muted mt-1"></p>
            </div>
            <div class="flex items-center gap-2">
                <!-- export: print / pdf or csv of whatever the table is showing -->
                <div class="relative">
                    <button id="export-btn" type="button" aria-haspopup="true" aria-expanded="false" class="btn btn-secondary px-3 py-2 text-xs font-medium border border-line-strong">
                        <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-8-4-4m0 0L8 8m4-4v12" stroke-linecap="round" stroke-linejoin="round" /></svg>
                        Export
                        <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </button>
                    <div id="export-menu" class="hidden absolute right-0 mt-1.5 w-48 card shadow-xl shadow-black/30 z-30 py-1 overflow-hidden" role="menu">
                        <button id="print-btn" type="button" role="menuitem" class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 hover:bg-raised transition cursor-pointer">
                            <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2m2 4h6a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2zm8-12V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v4h10z" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span class="font-medium">Print / Save PDF</span>
                        </button>
                        <button id="csv-btn" type="button" role="menuitem" class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 hover:bg-raised transition cursor-pointer">
                            <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3v-1m-4-4-4 4m0 0-4-4m4 4V4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                            <span class="font-medium">Export CSV</span>
                        </button>
                        <p class="px-3 pt-1.5 pb-1 mt-1 border-t border-line text-[10px] text-muted">Uses the current search, filters and sort</p>
                    </div>
                </div>
                <button id="new-customer-btn" class="btn btn-primary px-4 py-2 font-display ml-1">
                    <svg class="size-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    New Customer
                </button>
            </div>
        </div>

        <!-- search, created by filter, all / multiple jobs toggle and sort -->
        <section class="card p-3.5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="relative flex-1 max-w-md">
                <svg class="size-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M21 21l-6-6m2-5a7 7 0 1 1-14 0 7 7 0 0 1 14 0z" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <input id="search" type="text" placeholder="Search by name, phone or plate number" class="field pl-10" />
            </div>

            <div class="flex items-center gap-3 flex-wrap md:flex-nowrap">
                <!-- created by filter, admins only (options are built by the script) -->
                <div id="creator-dropdown" class="relative hidden">
                    <button id="creator-btn" type="button" aria-haspopup="true" aria-expanded="false"
                        class="flex items-center gap-2 text-xs bg-inset hover:bg-raised border border-line-strong rounded-lg px-3 py-2 transition cursor-pointer select-none">
                        <span class="text-muted font-medium whitespace-nowrap">Created by:</span>
                        <span id="creator-label" class="text-accent font-medium whitespace-nowrap">All Staff</span>
                        <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </button>
                    <div id="creator-menu" class="hidden absolute left-0 mt-1.5 w-52 card shadow-xl shadow-black/30 z-30 py-1.5 overflow-hidden"></div>
                </div>

                <div class="flex items-center bg-inset p-1 rounded-lg border border-line-strong text-xs font-semibold">
                    <button data-view="all" class="view-btn px-3 py-1.5 rounded-md"></button>
                    <button data-view="multiple" class="view-btn px-3 py-1.5 rounded-md"></button>
                </div>

                <!-- sort -->
                <div id="sort-dropdown" class="relative">
                    <button id="sort-btn" type="button" aria-haspopup="true" aria-expanded="false"
                        class="flex items-center gap-2 text-xs bg-inset hover:bg-raised border border-line-strong rounded-lg px-3 py-2 transition cursor-pointer select-none">
                        <span class="text-muted font-medium whitespace-nowrap">Sort:</span>
                        <span id="sort-label" class="text-accent font-medium whitespace-nowrap"></span>
                        <svg class="size-3.5 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </button>
                    <div id="sort-menu" class="hidden absolute right-0 mt-1.5 w-56 card shadow-xl shadow-black/30 z-30 py-1.5 overflow-hidden"></div>
                </div>
            </div>
        </section>

        <!-- customers table -->
        <section class="card overflow-hidden">
            <div class="max-h-[65vh] overflow-auto">
                <table class="w-full text-left">
                    <thead class="sticky top-0 z-10 bg-table-head text-[11px] font-semibold tracking-wider uppercase border-b border-line">
                        <tr>
                            <th class="px-6 py-3.5" scope="col">Customer</th>
                            <th class="px-6 py-3.5 whitespace-nowrap" scope="col">Phone</th>
                            <th class="px-6 py-3.5 whitespace-nowrap" scope="col">Member since</th>
                            <th class="px-6 py-3.5 text-center whitespace-nowrap" scope="col"># Vehicles</th>
                            <th class="px-6 py-3.5 text-center" scope="col">Jobs</th>
                            <th class="px-6 py-3.5" scope="col">Vehicles</th>
                            <th class="admin-only hidden px-6 py-3.5 whitespace-nowrap" scope="col">Created by</th>
                            <th class="px-6 py-3.5 w-10" scope="col"><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody id="customers-body" class="divide-y divide-line text-sm"></tbody>
                </table>
            </div>
            <p id="no-results" class="hidden p-8 text-center text-muted">No records found</p>

            <!-- footer: count on the left, page buttons on the right (same as the jobs table) -->
            <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-t border-line">
                <p id="showing-text" class="text-sm text-muted"></p>
                <nav id="pagination" class="flex items-center border border-line-strong rounded-lg overflow-hidden text-sm"></nav>
            </div>
        </section>
    </main>
    </div>

    <!-- row actions menu (admins only), moved next to whichever row's button was clicked -->
    <div id="row-menu" class="hidden fixed w-44 card shadow-xl shadow-black/40 z-40 py-1 overflow-hidden" role="menu">
        <button id="row-delete-btn" type="button" role="menuitem"
            class="w-full px-3 py-2 text-xs text-left flex items-center gap-2 text-status-overdue hover:bg-status-overdue/15 transition cursor-pointer">
            <svg class="size-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" /></svg>
            <span class="font-medium">Delete customer</span>
        </button>
    </div>

    <script type="module" src="/src/js/customers/customers.js"></script>
</body>
</html>
