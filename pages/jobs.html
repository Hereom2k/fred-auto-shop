<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobs - Fred's Auto Electrical</title>
    <link rel="stylesheet" href="/src/css/main.css" />
</head>
<body>
    <!-- the sidebar and top bar are added by src/js/shared/page.js -->

    <div class="flex flex-col">

    <main class="flex-1 p-6 space-y-5">

        <!-- page heading -->
        <div class="flex items-start justify-between">
            <div>
                <h1 class="font-display text-3xl font-bold tracking-wider">JOBS</h1>
                <p id="total-count" class="text-sm text-muted mt-1"></p>        <!-- total count -->
            </div>
            <div class="flex items-center gap-4">
                <button id="new-job-btn" class="btn btn-primary relative group" aria-keyshortcuts="Control+J" aria-describedby="new-job-hint">
                  <span class="text-xl leading-none">+</span> New Job
                  <!-- shortcut hint, shows on hover or keyboard focus (jobs.js swaps in the mac version) -->
                  <span id="new-job-hint" role="tooltip"
                      class="pointer-events-none absolute top-full right-0 mt-1.5 whitespace-nowrap font-mono text-[10px] tracking-wide text-muted/70
                            opacity-0 transition-opacity duration-150 group-hover:opacity-100 group-hover:delay-300 group-focus-visible:opacity-100">
                      <kbd data-shortcut-label>Ctrl+J</kbd>
                  </span>
                </button>
            </div>
        </div>

        <!-- search, active/delivered toggle and status chips -->
        <section class="card p-4 space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="relative flex-1 max-w-md">
                    <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-muted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
                    </svg>
                    <input id="search" type="text" placeholder="Search by customer, vehicle or plate number" class="field pl-9" />
                </div>

                <div class="flex flex-wrap items-center gap-3">
                    <!-- created by filter, admins only (options are built by the script) -->
                    <select id="creator-filter" class="admin-only hidden bg-inset border border-line-strong rounded-lg px-3 py-2 text-xs font-semibold text-ink focus:outline-none focus:border-accent cursor-pointer" aria-label="Filter by who created the job"></select>

                    <div class="flex bg-app border border-line-strong rounded-lg p-1 text-xs font-semibold">
                        <button data-view="active" class="view-btn px-3 py-1.5 rounded-md"></button>
                        <button data-view="delivered" class="view-btn px-3 py-1.5 rounded-md"></button>
                    </div>
                </div>
            </div>

            <!-- chips are built by the script so the counts stay correct -->
            <div id="status-chips" class="flex flex-wrap gap-2"></div>
        </section>

        <!-- jobs table -->
        <section class="card overflow-hidden">
            <div class="max-h-[65vh] overflow-y-auto">
                <table class="w-full text-left">
                    <thead class="sticky top-0 z-10 bg-table-head text-[11px] font-bold tracking-wider uppercase border-b border-line">
                        <tr>
                            <th class="px-5 py-4 w-[34%]">Problem</th>
                            <th class="px-5 py-4">Customer</th>
                            <th class="px-5 py-4">Vehicle</th>
                            <th class="admin-only hidden px-5 py-4">Created by</th>
                            <th class="px-5 py-4 text-center">Status</th>
                            <th class="px-5 py-4 w-10"></th>
                        </tr>
                    </thead>
                    <tbody id="jobs-body" class="divide-y divide-line"></tbody>
                </table>
            </div>
            <p id="no-results" class="hidden p-8 text-center text-muted">No records found</p>
            <!-- footer: count on the left, page buttons on the right -->
            <div class="flex flex-wrap items-center justify-between gap-3 px-5 py-4 border-t border-line">
                <p id="showing-text" class="text-sm text-muted"></p>
                <nav id="pagination" class="flex items-center border border-line-strong rounded-lg overflow-hidden text-sm"></nav>
            </div>
        </section>
    </main>
    </div>

    <script type="module" src="/src/js/jobs/jobs.js"></script>
</body>
</html>
