<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Password | Fred's Auto Electrical</title>
  <link rel="stylesheet" href="../src/css/main.css">
</head>

<body class="auth-background flex min-h-screen items-center justify-center p-4">

  <!-- set password card -->
  <main class="card relative w-full max-w-100 overflow-hidden shadow-2xl">
    <!-- gradient strip along the top -->
    <div class="h-0.75 w-full bg-linear-to-r from-accent to-secondary-600"></div>

    <div class="p-7 sm:p-8">
      <h1 class="mb-1 font-display text-xl font-semibold">Set your password</h1>
      <p class="mb-8 text-xs text-muted">Choose a password to activate your staff portal account</p>

      <form id="password-form">
        <!-- new password -->
        <div class="mb-6">
          <div class="mb-2 flex items-center justify-between">
            <label for="new-password" class="text-sm font-medium">New password</label>
            <span class="text-[10px] font-semibold tracking-wider text-muted">REQUIRED</span>
          </div>
          <div class="relative">
            <input id="new-password" type="password" autocomplete="new-password"
                   placeholder="Enter your password" minlength="8" required class="field py-3 pr-12">
            <button type="button" data-target="new-password" aria-label="Show password" aria-pressed="false"
                    class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-muted hover:text-accent">
              <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
          <p class="mt-2 text-xs leading-relaxed text-muted">Use at least 8 characters. A short phrase is easy to remember.</p>
        </div>

        <!-- confirm password -->
        <div class="mb-8">
          <div class="mb-2 flex items-center justify-between">
            <label for="confirm-password" class="text-sm font-medium">Confirm password</label>
            <span class="text-[10px] font-semibold tracking-wider text-muted">MUST MATCH</span>
          </div>
          <div class="relative">
            <input id="confirm-password" type="password" autocomplete="new-password"
                   placeholder="Confirm your password" minlength="8" required class="field py-3 pr-12">
            <button type="button" data-target="confirm-password" aria-label="Show password" aria-pressed="false"
                    class="toggle-password absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer text-muted hover:text-accent">
              <svg class="eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/>
                <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/>
                <path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/>
                <path d="m2 2 20 20"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- error or success message -->
        <p id="form-message" role="status" aria-live="polite" class="mb-4 hidden text-xs"></p>

        <button type="submit" id="save-button" disabled class="btn btn-primary w-full py-3">
          <!-- lightning icon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
          </svg>
          <span id="button-text">Save password</span>
        </button>
      </form>
    </div>
  </main>

  <script type="module" src="/src/js/auth/set-password.js"></script>
</body>
</html>
