
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Set Password | Fred's Auto Electrical</title>

    <!-- Tailwind CSS (development only) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }

        .page-background {
            background-color: #0C1012;
            background-image:
                linear-gradient(
                    rgba(37,191,173,0.035) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(37,191,173,0.035) 1px,
                    transparent 1px
                ),
                radial-gradient(
                    ellipse at 50% 30%,
                    rgba(37,191,173,0.08),
                    transparent 65%
                );

            background-size:
                40px 40px,
                40px 40px,
                100% 100%;
        }
    </style>
</head>

<body class="page-background min-h-screen
             flex items-center justify-center
             text-white p-4">

    <!-- Set Password Card -->
    <main class="relative w-full max-w-[400px]
                 bg-[#171B21]
                 border border-[#293038]
                 rounded-xl shadow-2xl
                 overflow-hidden">

        <!-- Gradient Top Border -->
        <div class="h-[3px] w-full
                    bg-gradient-to-r
                    from-[#25BFAD] to-[#0053DB]">
        </div>

        <div class="p-7 sm:p-8">

            <!-- Heading -->
            <h2 class="text-xl font-semibold mb-1">
                Set your password
            </h2>

            <p class="text-xs text-[#9CB1C2] mb-8">
                Choose a password to activate your
                staff portal account
            </p>

            <!-- Password Form -->
            <form id="password-form">

                <!-- New Password -->
                <div class="mb-6">

                    <div class="flex justify-between
                                items-center mb-2">

                        <label for="new-password"
                               class="text-sm font-medium">
                            New password
                        </label>

                        <span class="text-[10px]
                                     font-semibold
                                     tracking-wider
                                     text-[#8CAAB0]">
                            REQUIRED
                        </span>
                    </div>

                    <div class="relative">

                        <input
                            type="password"
                            id="new-password"
                            autocomplete="new-password"
                            placeholder="Enter your password"
                            minlength="8"
                            required
                            class="w-full p-3 pr-12
                                   bg-[#0D0E0F]
                                   border border-[#444]
                                   rounded-md
                                   text-white text-sm
                                   outline-none
                                   focus:border-[#25BFAD]"
                        >

                        <button
                            type="button"
                            class="toggle-password
                                   absolute right-3 top-1/2
                                   -translate-y-1/2
                                   text-[#8CAAB0]
                                   hover:text-[#25BFAD]"
                            data-target="new-password"
                            aria-label="Show new password"
                            aria-pressed="false">

                            <i data-lucide="eye"></i>
                        </button>
                    </div>

                    <p class="text-xs text-[#8CAAB0]
                              mt-2 leading-relaxed">
                        Use at least 8 characters.
                        A short phrase is easy to remember.
                    </p>

                </div>

                <!-- Confirm Password -->
                <div class="mb-8">

                    <div class="flex justify-between
                                items-center mb-2">

                        <label for="confirm-password"
                               class="text-sm font-medium">
                            Confirm password
                        </label>

                        <span class="text-[10px]
                                     font-semibold
                                     tracking-wider
                                     text-[#8CAAB0]">
                            MUST MATCH
                        </span>
                    </div>

                    <div class="relative">

                        <input
                            type="password"
                            id="confirm-password"
                            autocomplete="new-password"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                            class="w-full p-3 pr-12
                                   bg-[#0D0E0F]
                                   border border-[#444]
                                   rounded-md
                                   text-white text-sm
                                   outline-none
                                   focus:border-[#25BFAD]"
                        >

                        <button
                            type="button"
                            class="toggle-password
                                   absolute right-3 top-1/2
                                   -translate-y-1/2
                                   text-[#8CAAB0]
                                   hover:text-[#25BFAD]"
                            data-target="confirm-password"
                            aria-label="Show confirmation password"
                            aria-pressed="false">

                            <i data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Error / Success Message -->
                <p id="form-message"
                   role="status"
                   aria-live="polite"
                   class="hidden text-xs mb-4">
                </p>

                <!-- Save Password -->
                <button
                    type="submit"
                    id="save-button"
                    disabled
                    class="w-full py-3
                           bg-[#25BFAD]
                           text-[#071515]
                           font-semibold text-sm
                           rounded-md
                           hover:bg-[#27847C]
                           disabled:opacity-50
                           disabled:cursor-not-allowed
                           transition-colors
                           flex justify-center
                           items-center gap-2">

                    <i data-lucide="zap"
                       class="w-4 h-4"></i>

                    <span id="button-text">
                        Save password
                    </span>
                </button>

            </form>

        </div>
    </main>

    <!-- Supabase and JavaScript -->
    <script type="module">

        import { createClient } from
        "https://esm.sh/@supabase/supabase-js@2";

        const SUPABASE_URL =
            "https://pbkwwvnmlpaubrhomhnc.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_IG1ZQGq8Qk7wpaTIyqxqIA_EgjwWIwX";

        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

        lucide.createIcons();

        const form =
            document.getElementById("password-form");

        const newPassword =
            document.getElementById("new-password");

        const confirmPassword =
            document.getElementById("confirm-password");

        const saveButton =
            document.getElementById("save-button");

        const buttonText =
            document.getElementById("button-text");

        const formMessage =
            document.getElementById("form-message");

        let activationReady = false;

        function showMessage(message, success = false) {
            formMessage.textContent = message;
            formMessage.classList.remove(
                "hidden", "text-red-400", "text-green-400"
            );

            formMessage.classList.add(
                success ? "text-green-400" : "text-red-400"
            );
        }

        function validatePasswords() {
            const password = newPassword.value;
            const confirm = confirmPassword.value;

            const valid =
                password.length >= 8 &&
                password === confirm;

            saveButton.disabled = !activationReady || !valid;
        }

        newPassword.addEventListener(
            "input", validatePasswords
        );

        confirmPassword.addEventListener(
            "input", validatePasswords
        );

        // Show/hide password
        document.querySelectorAll(".toggle-password")
            .forEach(button => {

                button.addEventListener("click", () => {
                    const input = document.getElementById(
                        button.dataset.target
                    );

                    const showing = input.type === "password";

                    input.type = showing ? "text" : "password";

                    button.setAttribute(
                        "aria-label",
                        showing
                            ? "Hide password"
                            : "Show password"
                    );

                    button.setAttribute(
                        "aria-pressed",
                        String(showing)
                    );

                    button.querySelector("svg")
                        ?.setAttribute(
                            "data-lucide",
                            showing ? "eye-off" : "eye"
                        );

                    lucide.createIcons();
                });
            });

        // Check the invitation session.
        // Supabase processes the callback URL during
        // client initialization for supported invite links.
        async function checkActivationSession() {
            try {
                const { data, error } =
                    await supabase.auth.getUser();

                if (error || !data.user) {
                    throw new Error(
                        "Your invitation link is invalid or expired. Contact your admin for a new invitation."
                    );
                }

                // This must be a first-time activation,
                // not an arbitrary authenticated password change.
                const { data: profile, error: profileError } =
                    await supabase
                        .from("profiles")
                        .select("must_set_password")
                        .eq("profile_id", data.user.id)
                        .single();

                if (profileError ||
                    !profile?.must_set_password) {
                    throw new Error(
                        "This account is not awaiting password activation."
                    );
                }

                activationReady = true;
                validatePasswords();

            } catch (error) {
                activationReady = false;
                saveButton.disabled = true;
                showMessage(error.message);
            }
        }

        await checkActivationSession();

        // Save password
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (!activationReady) return;

            if (newPassword.value.length < 8) {
                showMessage(
                    "Password must contain at least 8 characters."
                );
                return;
            }

            if (newPassword.value !== confirmPassword.value) {
                showMessage("Passwords do not match.");
                return;
            }

            saveButton.disabled = true;
            buttonText.textContent = "Saving...";

            try {
            
                const { data, error } =
                    await supabase.functions.invoke(
                        "complete-activation",
                        {
                            body: {
                                password: newPassword.value
                            }
                        }
                    );

                if (error) {
                    throw error;
                }

                if (!data?.success) {
                    throw new Error("Password activation failed.");
                }

                

                showMessage("Password saved successfully!", true);

                // Require a fresh login
                const { error: signOutError } = await supabase.auth.signOut({
                    scope: "local"
                });

                if (signOutError) {
                    console.warn("Sign-out warning:", signOutError.message);
                }

window.location.replace("login.html");

            } catch (error) {
                console.error("Activation error:", error);

                showMessage(
                    error.message || "Unable to complete activation."
                );

                saveButton.disabled = false;
                buttonText.textContent = "Save password";
            }
        });

    </script>

</body>
</html>
